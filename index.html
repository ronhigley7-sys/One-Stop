<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3B/3C Nursing Operations Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#006d77;--teal-light:#83c5be;--teal-pale:#edf6f9;--teal-mid:#d4ecf0;--accent:#e29578;--text:#1a2e35;--text-mid:#456068;--text-light:#7a9aa2;--white:#ffffff;--bg:#f4f9fb;--border:#c8dfe5;--success:#2d9e6e;--radius-lg:16px;--radius-md:12px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}
.page-header{background:var(--teal);padding:32px 20px 34px;position:relative;overflow:hidden;text-align:center;}
.page-header::before{content:'';position:absolute;top:-60px;left:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.06);}
.page-header::after{content:'';position:absolute;bottom:-70px;right:-30px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,0.05);}
.header-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.18);border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.9);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;position:relative;z-index:1;}
.header-tag .dot{width:6px;height:6px;border-radius:50%;background:#83c5be;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.header-title{font-family:'Nunito',sans-serif;font-size:30px;font-weight:800;color:white;line-height:1.15;margin-bottom:8px;position:relative;z-index:1;}
.header-sub{font-size:14px;color:rgba(255,255,255,0.75);position:relative;z-index:1;}
.container{max-width:920px;margin:0 auto;padding:20px 16px;}
.search-wrap{position:relative;margin-bottom:26px;}
.search-wrap input{width:100%;padding:14px 16px 14px 44px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-family:'Nunito Sans',sans-serif;font-size:15px;color:var(--text);background:white;outline:none;box-shadow:0 2px 12px rgba(0,109,119,0.08);}
.search-wrap input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,109,119,0.12);}
.search-wrap .icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:17px;color:var(--text-light);pointer-events:none;}
.section-title{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-mid);margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title:first-of-type{margin-top:0;}
.section-title .line{flex:1;height:1px;background:var(--teal-mid);}
.card-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media (min-width:640px){.card-grid{grid-template-columns:1fr 1fr;}}
.card{display:flex;gap:14px;align-items:flex-start;background:white;border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;text-decoration:none;color:inherit;box-shadow:0 2px 12px rgba(0,109,119,0.08);transition:all 0.15s;}
.card:hover{border-color:var(--teal-light);box-shadow:0 4px 20px rgba(0,109,119,0.16);transform:translateY(-1px);}
.card-icon{width:42px;height:42px;border-radius:11px;background:var(--teal-pale);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.card-body{flex:1;min-width:0;}
.card-title{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--teal);margin-bottom:3px;}
.card-desc{font-size:12.5px;color:var(--text-mid);line-height:1.4;}
.card-status{display:inline-block;margin-top:6px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;padding:2px 8px;border-radius:10px;}
.card-status.pending{background:#fff5eb;color:#c0673a;}
.card-status.new{background:#edf6f9;color:#006d77;}
.footer-note{text-align:center;font-size:11px;color:var(--text-light);margin-top:30px;}
.footer-note.error{color:#c0673a;}
.hidden{display:none !important;}
.loading-note{text-align:center;font-size:12px;color:var(--text-light);padding:20px;}
</style>
</head>
<body>

<div class="page-header">
  <div class="header-tag"><span class="dot"></span> 3B/3C Tele Med Surg · Stroke Telemetry</div>
  <div class="header-title">Nursing Operations Hub</div>
  <div class="header-sub">All the tools, in one place</div>
</div>

<div class="container">

  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input type="text" id="searchBox" placeholder="Search tools…" oninput="filterCards()" disabled>
  </div>

  <div id="sections"></div>

  <div class="loading-note" id="loadingNote">Loading tools…</div>
  <div class="footer-note" id="noResults" style="display:none;">No tools match your search.</div>

</div>

<script>
/* ============================================================
   CONFIG — this is the only part you should ever need to touch.
   ============================================================ */

// Your GitHub Pages account
const GITHUB_USER = 'ronhigley7-sys';

// Repos to hide entirely (the hub itself, forks, scratch repos, etc.)
// Match on the repo name exactly as it appears on GitHub.
const EXCLUDE_REPOS = ['One-Stop', 'ronhigley7-sys', 'ronhigley7-sys.github.io'];

// Section order + display titles
const SECTIONS = [
  { key: 'operations', title: 'Daily Operations' },
  { key: 'quality',    title: 'Quality & Safety' },
  { key: 'people',     title: 'People & Scheduling' },
  { key: 'new',        title: 'Recently Added' } // catch-all for repos not yet configured below
];

// Known tools: repo name -> display info. Add an entry here any time
// you want to move a tool out of "Recently Added" and into a real
// section with a custom icon/description.
const TOOL_CONFIG = {
  'CC':                        { title: 'Command Center', icon: '🖥️', section: 'operations', desc: 'Staffing board, charge assignments, call-in coverage, education, quality, budget & more — the main hub.' },
  'Dash':                      { title: 'Float & Sitter Board', icon: '🔄', section: 'operations', desc: 'Live board of last float, sitter, call-off, and mandation dates per staff member.' },
  'Form':                      { title: 'Staff Submission Form', icon: '📝', section: 'operations', desc: 'Where staff log their own float, sitter, call-off, and payout events each shift.' },
  'Rounding-Board':            { title: 'Rounding Board', icon: '🩺', section: 'operations', desc: 'Daily rounding checklist: DNR verification, tele monitoring, pain reassessment, care plans, 1:1 sitters, BERT, PLATO/hand-hygiene round counts, and staffing.' },
  'Fall-Dashboard-':           { title: 'Fall Event Reporting Tracker', icon: '🚶', section: 'quality', desc: 'Fall events, PLATO rounding compliance, and correlation analysis by unit and staff.' },
  'Office-Dashboard-':         { title: '3rd Floor Monthly KPI Dashboard', icon: '📊', section: 'quality', desc: 'Audit compliance, patient safety, quality metrics, and Press Ganey — TV display mode included.' },
  'Weekly-High-Pay':           { title: 'High Pay Dashboard', icon: '💰', section: 'quality', desc: 'Weekly view of High Pay entries by staff member, with who authorized each one.' },
  'Centrally-Falls-Committee-':{ title: 'Falls Committee', icon: '🏛️', section: 'quality', desc: 'Placeholder — page not built out yet.', status: 'pending' },
  'Audit':                     { title: 'Chart & Unit Audit Non-Compliance Tracker', icon: '🗂️', section: 'quality', desc: 'Non-compliance findings from chart, sitter, behavioral health, and pain reassessment audits.' },
  'Employee-Eval':             { title: 'Annual Performance Evaluation', icon: '📋', section: 'people', desc: 'Competency ratings, compliance status, code of conduct, and e-signatures for annual reviews.' },
  'Schedule-':                 { title: 'Monthly Staff Schedule', icon: '📅', section: 'people', desc: 'Printable monthly schedule by role — week view and full-month view.' },
  'orientation-shett':         { title: 'Orientation Sheet', icon: '🎓', section: 'people', desc: 'Unit orientation checklist with e-signature — feeds into the Command Center on submission.' },
  'Agents-':                   { title: 'Agent Reviews', icon: '🕵️', section: 'people', desc: 'Agent review tracking.' },
  '30-60-90':                  { title: '30/60/90 Evals', icon: '📈', section: 'people', desc: 'New hire 30/60/90-day evaluation tracking.' }
};

const DEFAULT_ICON = '🔧';
const CACHE_KEY = 'nursing-hub-repo-cache-v1';
const CACHE_TTL_MS = 60 * 60 * 1000; // 1 hour

/* ============================================================
   Below this line is plumbing — shouldn't need to edit.
   ============================================================ */

function humanizeName(repoName) {
  return repoName
    .replace(/[-_]+/g, ' ')
    .replace(/\s+$/, '')
    .trim()
    .replace(/\b\w/g, c => c.toUpperCase());
}

async function fetchRepos() {
  // Serve from cache if fresh, so we're not hammering the unauthenticated
  // GitHub API (60 req/hr limit) every time the page loads.
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (cached && (Date.now() - cached.ts) < CACHE_TTL_MS) {
      return cached.repos;
    }
  } catch (e) { /* ignore cache errors */ }

  const repos = [];
  let page = 1;
  while (true) {
    const res = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&page=${page}&sort=updated`);
    if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
    const batch = await res.json();
    repos.push(...batch);
    if (batch.length < 100) break;
    page++;
  }

  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), repos }));
  } catch (e) { /* storage may be full/unavailable — fine, just skip caching */ }

  return repos;
}

function buildCard(repoName, info) {
  const url = `https://${GITHUB_USER}.github.io/${repoName}/`;
  const statusHtml = info.status
    ? `<span class="card-status ${info.status}">${info.status === 'pending' ? 'In Progress' : 'New'}</span>`
    : '';
  const searchName = [repoName, info.title, info.desc].join(' ').toLowerCase();

  const a = document.createElement('a');
  a.className = 'card';
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.dataset.name = searchName;
  a.innerHTML = `
    <div class="card-icon">${info.icon}</div>
    <div class="card-body">
      <div class="card-title">${info.title}</div>
      <div class="card-desc">${info.desc}</div>
      ${statusHtml}
    </div>`;
  return a;
}

async function init() {
  const sectionsEl = document.getElementById('sections');
  const loadingNote = document.getElementById('loadingNote');
  const searchBox = document.getElementById('searchBox');

  // Build empty section containers up front, in order
  const gridsByKey = {};
  SECTIONS.forEach(sec => {
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = `<span>${sec.title}</span><span class="line"></span>`;
    const grid = document.createElement('div');
    grid.className = 'card-grid';
    grid.dataset.section = sec.key;
    sectionsEl.appendChild(title);
    sectionsEl.appendChild(grid);
    gridsByKey[sec.key] = { title, grid };
  });

  let repos;
  try {
    repos = await fetchRepos();
  } catch (err) {
    loadingNote.textContent = 'Could not load tools from GitHub right now — check your connection or GitHub API rate limit, then refresh.';
    loadingNote.classList.add('error');
    return;
  }

  const pagesRepos = repos.filter(r => r.has_pages && !EXCLUDE_REPOS.includes(r.name));

  if (pagesRepos.length === 0) {
    loadingNote.textContent = 'No GitHub Pages-enabled repos found for this account yet.';
    return;
  }

  pagesRepos
    .sort((a, b) => a.name.localeCompare(b.name))
    .forEach(repo => {
      const known = TOOL_CONFIG[repo.name];
      const info = known || {
        title: humanizeName(repo.name),
        icon: DEFAULT_ICON,
        section: 'new',
        desc: repo.description || 'Newly deployed tool — add an entry to TOOL_CONFIG to customize this card.',
        status: 'new'
      };
      const target = gridsByKey[info.section] || gridsByKey['new'];
      target.grid.appendChild(buildCard(repo.name, info));
    });

  // Hide any section with no cards
  Object.values(gridsByKey).forEach(({ title, grid }) => {
    const empty = grid.children.length === 0;
    title.classList.toggle('hidden', empty);
    grid.classList.toggle('hidden', empty);
  });

  loadingNote.style.display = 'none';
  searchBox.disabled = false;
}

function filterCards() {
  const q = document.getElementById('searchBox').value.toLowerCase().trim();
  const cards = document.querySelectorAll('.card');
  let anyVisible = false;
  cards.forEach(c => {
    const match = !q || c.dataset.name.includes(q);
    c.classList.toggle('hidden', !match);
    if (match) anyVisible = true;
  });
  document.querySelectorAll('.card-grid').forEach(grid => {
    const visibleCount = grid.querySelectorAll('.card:not(.hidden)').length;
    const hasAnyCards = grid.children.length > 0;
    grid.previousElementSibling.classList.toggle('hidden', !hasAnyCards || visibleCount === 0);
    grid.classList.toggle('hidden', !hasAnyCards || visibleCount === 0);
  });
  document.getElementById('noResults').style.display = (anyVisible || !q) ? 'none' : 'block';
}

init();
</script>
</body>
</html>
